<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARKVISION - Estacionamiento inteligente</title>
<style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
 
        header {
            background: #0f172a;
            color: white;
            padding: 25px;
            text-align: center;
        }
 
        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
 
        .resumen, .espacios {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
 
        .tarjeta, .espacio {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px #0001;
        }
 
        .numero {
            font-size: 32px;
            font-weight: bold;
        }
 
        .libre {
            border-bottom: 6px solid #16a34a;
        }
 
        .ocupado {
            border-bottom: 6px solid #dc2626;
        }
 
        .reservado {
            border-bottom: 6px solid #f59e0b;
        }
 
        h2 {
            margin-top: 35px;
        }
 
        @media (max-width: 600px) {
            .resumen, .espacios {
                grid-template-columns: repeat(2, 1fr);
            }
        }
</style>
</head>
<body>
 
<header>
<h1>PARKVISION</h1>
<p>Sistema inteligente de estacionamiento</p>
</header>
 
<main>
<h2>Panel de disponibilidad</h2>
 
    <section class="resumen">
<div class="tarjeta">
<p>Espacios totales</p>
<div class="numero">6</div>
</div>
 
        <div class="tarjeta">
<p>Disponibles</p>
<div class="numero">3</div>
</div>
 
        <div class="tarjeta">
<p>Ocupados</p>
<div class="numero">2</div>
</div>
</section>
 
    <h2>Estado del estacionamiento</h2>
 
    <section class="espacios">
<div class="espacio libre">
<h3>Espacio 01</h3>
<p>Libre</p>
</div>
 
        <div class="espacio ocupado">
<h3>Espacio 02</h3>
<p>Ocupado</p>
</div>
 
        <div class="espacio libre">
<h3>Espacio 03</h3>
<p>Libre</p>
</div>
 
        <div class="espacio ocupado">
<h3>Espacio 04</h3>
<p>Ocupado</p>
</div>
 
        <div class="espacio libre">
<h3>Espacio 05</h3>
<p>Libre</p>
</div>
 
        <div class="espacio reservado">
<h3>Espacio 06</h3>
<p>Reservado</p>
</div>
</section>
</main>
 
</body>
</html>
